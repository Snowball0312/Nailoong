<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4eee0">
  <title>奶龙 · 3D 小档案</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #3e382d;
      --muted: #8b8274;
      --paper: #f6f2e9;
      --line: rgba(91, 77, 53, .12);
      --accent: #a47c36;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: "DM Sans", "Noto Sans SC", sans-serif;
    }

    button { font: inherit; }

    .page {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: 100%;
      height: 100vh;
      min-height: 560px;
      padding: 30px 5.1vw 23px;
    }

    .topbar, .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #65573e;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border: 1px solid rgba(164, 124, 54, .3);
      border-radius: 50%;
      color: var(--accent);
      font-size: 14px;
    }

    .edition {
      color: #9a907f;
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    main {
      position: relative;
      display: grid;
      min-height: 0;
      place-items: center;
    }

    .intro {
      position: absolute;
      z-index: 1;
      top: 12.5%;
      left: 0;
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .23em;
    }

    h1 {
      margin: 0;
      font-family: "Noto Sans SC", sans-serif;
      font-size: clamp(39px, 5.4vw, 68px);
      font-weight: 600;
      letter-spacing: .08em;
      line-height: 1.16;
    }

    .subtitle {
      margin: 12px 0 0;
      color: #8b8274;
      font-size: 13px;
      letter-spacing: .04em;
    }

    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    .stage:active { cursor: grabbing; }
    .stage canvas { display: block; width: 100%; height: 100%; }

    .hint {
      position: absolute;
      z-index: 1;
      right: 0;
      bottom: 8%;
      color: #968d7e;
      font-size: 11px;
      letter-spacing: .04em;
      pointer-events: none;
    }

    .view-controls {
      position: absolute;
      z-index: 2;
      right: 0;
      bottom: 15%;
      display: flex;
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(91, 77, 53, .11);
      border-radius: 999px;
      background: rgba(250, 248, 243, .8);
      box-shadow: 0 8px 30px rgba(88, 71, 43, .05);
      backdrop-filter: blur(12px);
    }

    .view-button, .icon-button {
      border: 0;
      color: #837967;
      background: transparent;
      cursor: pointer;
      transition: color .2s ease, background .2s ease, transform .2s ease;
    }

    .view-button {
      min-width: 48px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 11px;
    }

    .view-button:hover, .icon-button:hover { color: #594621; }
    .view-button:active, .icon-button:active { transform: scale(.96); }

    .view-button[aria-pressed="true"] {
      color: #fffdf8;
      background: #a47c36;
    }

    .footer {
      min-height: 47px;
      border-top: 1px solid var(--line);
      color: #948a79;
      font-size: 10px;
      letter-spacing: .12em;
    }

    .footer-note { display: flex; align-items: center; gap: 9px; }
    .footer-dot { width: 5px; height: 5px; border-radius: 50%; background: #b99a5c; }

    .tools { display: flex; align-items: center; gap: 9px; }

    .export-button {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #75684f;
      background: rgba(250, 248, 243, .75);
      cursor: pointer;
      font-size: 10px;
      transition: color .2s ease, background .2s ease;
    }

    .export-button:hover { color: #594621; background: #fffdf8; }

    .icon-button {
      display: grid;
      width: 33px;
      height: 33px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
    }

    .icon-button[aria-pressed="true"] {
      color: #fffdf8;
      border-color: #a47c36;
      background: #a47c36;
    }

    .icon-button svg { width: 14px; height: 14px; }
    .tool-label { margin-right: 7px; }

    @media (max-width: 650px) {
      .page { min-height: 520px; padding: 20px 22px 14px; }
      .edition { font-size: 8px; }
      .intro { top: 5%; }
      .subtitle { max-width: 210px; margin-top: 6px; font-size: 11px; }
      .view-controls { right: 50%; bottom: 2%; transform: translateX(50%); }
      .hint { display: none; }
      .footer { font-size: 8px; letter-spacing: .06em; }
      .tool-label { display: none; }
      .export-button { padding: 7px 8px; font-size: 9px; }
    }

    @media (max-width: 360px) {
      .page { padding: 14px 12px 10px; }
      .topbar { gap: 8px; }
      .brand { gap: 6px; font-size: 9px; letter-spacing: .1em; }
      .brand-mark { width: 24px; height: 24px; font-size: 12px; }
      .brand span:last-child { max-width: 90px; line-height: 1.4; }
      .edition { max-width: 70px; font-size: 7px; line-height: 1.4; text-align: right; }
      .intro { top: 5%; max-width: 100%; }
      .eyebrow { margin-bottom: 8px; font-size: 8px; letter-spacing: .15em; }
      h1 { font-size: 36px; }
      .subtitle { max-width: 170px; font-size: 10px; }
      .footer { min-height: 39px; }
      .footer-note { display: none; }
      .tools { justify-content: center; gap: 5px; }
      .export-button { padding: 6px; font-size: 8px; }
      .icon-button { width: 29px; height: 29px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">奶</span><span>Little character study</span></div>
      <div class="edition">CHARACTER No. 001&nbsp; / &nbsp;3D VIEW</div>
    </header>

    <main>
      <section class="intro" aria-label="角色介绍">
        <p class="eyebrow">SOFT · SUNNY · A LITTLE SILLY</p>
        <h1>奶龙</h1>
        <p class="subtitle">圆滚滚的好心情，正在 360° 展示中。</p>
      </section>

      <div class="stage" id="stage" aria-label="奶龙 3D 模型，可拖动旋转、滚轮缩放"></div>
      <nav class="view-controls" aria-label="模型视角">
        <button class="view-button" data-view="front" aria-pressed="true">正面</button>
        <button class="view-button" data-view="side" aria-pressed="false">侧面</button>
        <button class="view-button" data-view="back" aria-pressed="false">背面</button>
      </nav>
      <div class="hint">拖动旋转&nbsp; · &nbsp;滚轮缩放</div>
    </main>

    <footer class="footer">
      <div class="footer-note"><span class="footer-dot"></span><span>一只软乎乎的黄色小伙伴</span></div>
      <div class="tools">
        <span class="tool-label">探索模型</span>
        <button class="export-button" id="export-json-button" type="button">导出场景 JSON</button>
        <button class="export-button" id="export-glb-button" type="button">导出 GLB</button>
        <button class="icon-button" id="spin-button" aria-label="切换自动旋转" aria-pressed="true" title="切换自动旋转">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 7v5h-5M4 17v-5h5"></path><path d="M5.6 9a7 7 0 0 1 11.6-2L20 9M4 15l2.8 2a7 7 0 0 0 11.6-2"></path>
          </svg>
        </button>
        <button class="icon-button" id="reset-button" aria-label="重置视角" title="重置视角">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 11a9 9 0 1 1 2.6 6.4L3 15"></path><path d="M3 20v-5h5"></path>
          </svg>
        </button>
      </div>
    </footer>
  </div>

    }
  </script>

    function isBodyColor(r, g, b) {
      return r > 130 && g > 100 && r - g > 20 && g - b > 25;
    }

    async function readProjectionImage(data) {
      const image = new Image();
      image.src = `data:image/png;base64,${data}`;
      await image.decode();
      const canvas = document.createElement("canvas");
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(image, 0, 0);
      const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
      let left = canvas.width;
      let top = canvas.height;
      let right = -1;
      let bottom = -1;
      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          const index = (y * canvas.width + x) * 4;
          if (isBodyColor(pixels[index], pixels[index + 1], pixels[index + 2])) {
            left = Math.min(left, x);
            right = Math.max(right, x);
            top = Math.min(top, y);
            bottom = Math.max(bottom, y);
          }
        }
      }
      if (right < left || bottom < top) {
        throw new Error("The reference projection contains no detectable yellow body pixels.");
      }
      return { pixels, width: canvas.width, height: canvas.height, bounds: { left, top, right, bottom } };
    }

    const [frontProjection, sideProjection, backProjection] = await Promise.all([
      readProjectionImage(referenceProjectionData.front),
      readProjectionImage(referenceProjectionData.side),
      readProjectionImage(referenceProjectionData.back),
    ]);

    const stage = document.querySelector("#stage");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#f6f2e9");
    scene.fog = new THREE.Fog("#f6f2e9", 9, 20);

    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
    camera.position.set(0, 2.35, 9.5);
    scene.add(camera);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    stage.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.15, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.minDistance = 5.8;
    controls.maxDistance = 13;
    controls.minPolarAngle = Math.PI * 0.28;
    controls.maxPolarAngle = Math.PI * 0.62;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.update();

    scene.add(new THREE.HemisphereLight("#fff9e9", "#82745b", 2.0));
    const keyLight = new THREE.DirectionalLight("#fff4d9", 3.4);
    keyLight.position.set(-3.5, 7, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 7;
    keyLight.shadow.camera.bottom = -4;
    keyLight.shadow.bias = -0.00025;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight("#fffefa", 1.15);
    fillLight.position.set(4, 4, 3);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight("#f4cb63", 2.1);
    rimLight.position.set(-4, 4.5, -4);
    scene.add(rimLight);

    const floorMaterial = new THREE.MeshStandardMaterial({ color: "#e9e1d1", roughness: 1 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0.025;
    floor.receiveShadow = true;
    scene.add(floor);

    const character = new THREE.Group();
    character.scale.x = 1.12;
    scene.add(character);

    const bodyMaterial = new THREE.MeshStandardMaterial({
      color: "#ffffff",
      roughness: 0.84,
      metalness: 0,
    });
    const bodyLimbMaterial = new THREE.MeshStandardMaterial({
      color: "#ffffff",
      roughness: 0.84,
      metalness: 0,
      vertexColors: true,
    });
    const bodyDetailMaterial = new THREE.MeshStandardMaterial({ color: "#e9ad20", roughness: 0.84 });
    const bellyMaterial = new THREE.MeshStandardMaterial({
      color: "#f0dfc9",
      roughness: 0.88,
      metalness: 0,
    });
    const extremityMaterial = new THREE.MeshStandardMaterial({ color: "#625644", roughness: 0.93 });
    const handMaterial = extremityMaterial;
    const footMaterial = extremityMaterial;
    const eyeRimMaterial = new THREE.MeshStandardMaterial({ color: "#50a637", roughness: 0.48 });
    const irisMaterial = new THREE.MeshStandardMaterial({ color: "#12552d", roughness: 0.4 });
    const pupilMaterial = new THREE.MeshStandardMaterial({ color: "#10271a", roughness: 0.32 });
    const glintMaterial = new THREE.MeshBasicMaterial({ color: "#fffbed" });
    const mouthMaterial = new THREE.MeshStandardMaterial({ color: "#76512c", roughness: 0.75 });

    function ellipsoid(parent, material, position, scale, segments = 40) {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, Math.max(24, Math.floor(segments * 0.65))), material);
      mesh.position.set(...position);
      mesh.scale.set(...scale);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    const bodyBaseColor = new THREE.Color("#e9ad20");
    const extremityColor = new THREE.Color("#625644");

    function sampleProjection(projection, horizontal, y, worldWidth, kernelRadius = 4) {
      const { bounds, pixels, width, height } = projection;
      const u = horizontal / worldWidth + 0.5;
      const v = 1 - y / 4.30;
      if (u < 0 || u > 1 || v < 0 || v > 1) return null;
      const px = Math.round(THREE.MathUtils.lerp(bounds.left, bounds.right, u));
      const py = Math.round(THREE.MathUtils.lerp(bounds.top, bounds.bottom, v));
      let red = 0;
      let green = 0;
      let blue = 0;
      let count = 0;
      for (let dy = -kernelRadius; dy <= kernelRadius; dy++) {
        for (let dx = -kernelRadius; dx <= kernelRadius; dx++) {
          const sampleX = THREE.MathUtils.clamp(px + dx, 0, width - 1);
          const sampleY = THREE.MathUtils.clamp(py + dy, 0, height - 1);
          const index = (sampleY * width + sampleX) * 4;
          const r = pixels[index];
          const g = pixels[index + 1];
          const b = pixels[index + 2];
          if (!isBodyColor(r, g, b)) continue;
          red += r;
          green += g;
          blue += b;
          count++;
        }
      }
      if (!count) return null;
      return new THREE.Color().setRGB(red / count / 255, green / count / 255, blue / count / 255, THREE.SRGBColorSpace);
    }

    function projectedBodyColor(x, y, z, normal, kernelRadius = 4) {
      const worldX = x * character.scale.x;
      const frontWeight = Math.max(normal.z, 0) ** 4;
      const backWeight = Math.max(-normal.z, 0) ** 4;
      const sideWeight = Math.abs(normal.x) ** 4;
      const samples = [
        [frontProjection, worldX, frontWeight, 2.42],
        [backProjection, worldX, backWeight, 2.42],
        [sideProjection, z * Math.sign(normal.x || 1), sideWeight, 1.72],
      ];
      const projected = new THREE.Color(0, 0, 0);
      let coverage = 0;
      for (const [projection, horizontal, weight, width] of samples) {
        if (weight <= 0.01) continue;
        const sample = sampleProjection(projection, horizontal, y, width, kernelRadius);
        if (!sample) continue;
        projected.r += sample.r * weight;
        projected.g += sample.g * weight;
        projected.b += sample.b * weight;
        coverage += weight;
      }
      const result = bodyBaseColor.clone();
      if (coverage > 0.01) {
        projected.multiplyScalar(1 / coverage);
        result.lerp(projected, Math.min(0.18, coverage * 0.18));
      }
      return result;
    }

    function bakeProjectedBodyTexture(rings) {
      const size = 256;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext("2d", { willReadFrequently: false });
      const imageData = context.createImageData(size, size);

      for (let row = 0; row < size; row++) {
        const y = THREE.MathUtils.lerp(4.30, 0.85, row / (size - 1));
        let lower = rings[0];
        let upper = rings[rings.length - 1];
        for (let index = 1; index < rings.length; index++) {
          if (rings[index].y >= y) {
            lower = rings[index - 1];
            upper = rings[index];
            break;
          }
        }
        const amount = THREE.MathUtils.clamp((y - lower.y) / (upper.y - lower.y), 0, 1);
        const radiusX = THREE.MathUtils.lerp(lower.x, upper.x, amount);
        const radiusZ = THREE.MathUtils.lerp(lower.z, upper.z, amount);
        const bellySweep = 0.12 * Math.exp(-(((y - 1.95) / 0.68) ** 2));
        const faceSweep = 0.045 * Math.exp(-(((y - 3.78) / 0.34) ** 2));
        const backSweep = 0.045 * Math.exp(-(((y - 1.65) / 0.56) ** 2));

        for (let column = 0; column < size; column++) {
          const angle = (column / (size - 1)) * Math.PI * 2;
          const cosine = Math.cos(angle);
          const sine = Math.sin(angle);
          const depth = radiusZ * sine;
          const offset = depth >= 0
            ? bellySweep + faceSweep - bellyInsetAt(radiusX * cosine, y)
            : -backSweep;
          const normal = new THREE.Vector3(cosine / radiusX, 0, sine / radiusZ).normalize();
          const color = projectedBodyColor(radiusX * cosine, y, depth + offset, normal, 0)
            .convertLinearToSRGB();
          const pixel = (row * size + column) * 4;
          imageData.data[pixel] = Math.round(THREE.MathUtils.clamp(color.r, 0, 1) * 255);
          imageData.data[pixel + 1] = Math.round(THREE.MathUtils.clamp(color.g, 0, 1) * 255);
          imageData.data[pixel + 2] = Math.round(THREE.MathUtils.clamp(color.b, 0, 1) * 255);
          imageData.data[pixel + 3] = 255;
        }
      }

      context.putImageData(imageData, 0, 0);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.needsUpdate = true;
      return texture;
    }

    function addProjectedVertexColors(geometry, positions, limbEndFade = null) {
      const normals = geometry.getAttribute("normal");
      const colors = [];
      for (let index = 0; index < positions.length; index += 3) {
        const vertex = index / 3;
        const color = projectedBodyColor(
          positions[index],
          positions[index + 1],
          positions[index + 2],
          new THREE.Vector3(normals.getX(vertex), normals.getY(vertex), normals.getZ(vertex)),
        );
        if (limbEndFade) color.lerp(extremityColor, limbEndFade(vertex));
        colors.push(color.r, color.g, color.b);
      }
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
    }

    const bodyProfile = [
        new THREE.Vector3(0.025, 0.85, 0.025),
        new THREE.Vector3(0.31, 0.90, 0.31),
        new THREE.Vector3(0.51, 1.00, 0.43),
        new THREE.Vector3(0.72, 1.20, 0.53),
        new THREE.Vector3(0.84, 1.52, 0.62),
        new THREE.Vector3(0.83, 1.96, 0.64),
        new THREE.Vector3(0.69, 2.34, 0.55),
        new THREE.Vector3(0.48, 2.66, 0.43),
        new THREE.Vector3(0.37, 3.00, 0.36),
        new THREE.Vector3(0.36, 3.36, 0.35),
        new THREE.Vector3(0.43, 3.72, 0.39),
        new THREE.Vector3(0.40, 4.02, 0.36),
        new THREE.Vector3(0.27, 4.23, 0.25),
        new THREE.Vector3(0.025, 4.30, 0.025),
    ];

    function bellyInsetAt(x, y) {
      const normalizedRadius = Math.sqrt((x / 0.69) ** 2 + ((y - 1.98) / 0.54) ** 2);
      const edge = THREE.MathUtils.smoothstep(normalizedRadius, 0.88, 1);
      return 0.018 * (1 - edge);
    }

    function makeBody() {
      const outline = new THREE.CatmullRomCurve3(bodyProfile, false, "centripetal");
      const rings = outline.getPoints(180);
      const radialSegments = 96;
      const positions = [];
      const uvs = [];
      const indices = [];

      for (const ring of rings) {
        const bellySweep = 0.12 * Math.exp(-(((ring.y - 1.95) / 0.68) ** 2));
        const faceSweep = 0.045 * Math.exp(-(((ring.y - 3.78) / 0.34) ** 2));
        const backSweep = 0.045 * Math.exp(-(((ring.y - 1.65) / 0.56) ** 2));
        for (let j = 0; j <= radialSegments; j++) {
          const angle = (j / radialSegments) * Math.PI * 2;
          const depth = ring.z * Math.sin(angle);
          const offset = depth >= 0
            ? bellySweep + faceSweep - bellyInsetAt(ring.x * Math.cos(angle), ring.y)
            : -backSweep;
          positions.push(ring.x * Math.cos(angle), ring.y, depth + offset);
          uvs.push(j / radialSegments, (ring.y - 0.85) / (4.30 - 0.85));
        }
      }

      for (let i = 0; i < rings.length - 1; i++) {
        for (let j = 0; j < radialSegments; j++) {
          const a = i * (radialSegments + 1) + j;
          const b = a + radialSegments + 1;
          indices.push(a, b, a + 1, b, b + 1, a + 1);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      const bodyNormals = geometry.getAttribute("normal");
      for (let i = 0; i < rings.length; i++) {
        const first = i * (radialSegments + 1);
        const last = first + radialSegments;
        bodyNormals.setXYZ(last, bodyNormals.getX(first), bodyNormals.getY(first), bodyNormals.getZ(first));
      }
      bodyMaterial.map = bakeProjectedBodyTexture(rings);
      bodyMaterial.needsUpdate = true;
      const body = new THREE.Mesh(geometry, bodyMaterial);
      body.castShadow = true;
      body.receiveShadow = true;
      character.add(body);

      return (x, y) => {
        let upper = rings[0];
        let lower = rings[rings.length - 1];
        for (let index = 1; index < rings.length; index++) {
          if (rings[index].y >= y) {
            upper = rings[index];
            lower = rings[index - 1];
            break;
          }
        }
        const amount = THREE.MathUtils.clamp((y - lower.y) / (upper.y - lower.y), 0, 1);
        const radiusX = THREE.MathUtils.lerp(lower.x, upper.x, amount);
        const radiusZ = THREE.MathUtils.lerp(lower.z, upper.z, amount);
        const normalizedX = THREE.MathUtils.clamp(x / radiusX, -0.999, 0.999);
        const bellySweep = 0.12 * Math.exp(-(((y - 1.95) / 0.68) ** 2));
        const faceSweep = 0.045 * Math.exp(-(((y - 3.78) / 0.34) ** 2));
        return bellySweep + faceSweep - bellyInsetAt(x, y) + radiusZ * Math.sqrt(1 - normalizedX ** 2);
      };
    }

    function makeBellyPatch(surfaceAt) {
      const rings = 32;
      const segments = 128;
      const positions = [0, 1.98, surfaceAt(0, 1.98) + 0.009];
      const uvs = [0.5, 0.5];
      const indices = [];

      for (let ring = 1; ring <= rings; ring++) {
        const radius = ring / rings;
        for (let segment = 0; segment < segments; segment++) {
          const angle = (segment / segments) * Math.PI * 2;
          const x = 0.69 * radius * Math.cos(angle);
          const y = 1.98 + 0.54 * radius * Math.sin(angle);
          positions.push(x, y, surfaceAt(x, y) + 0.009);
          uvs.push(0.5 + x / 1.38, 0.5 + (y - 1.98) / 1.08);
        }
      }

      for (let segment = 0; segment < segments; segment++) {
        const current = 1 + segment;
        const next = 1 + ((segment + 1) % segments);
        indices.push(0, current, next);
      }

      for (let ring = 1; ring < rings; ring++) {
        const innerStart = 1 + (ring - 1) * segments;
        const outerStart = 1 + ring * segments;
        for (let segment = 0; segment < segments; segment++) {
          const next = (segment + 1) % segments;
          const a = innerStart + segment;
          const b = innerStart + next;
          const c = outerStart + segment;
          const d = outerStart + next;
          indices.push(a, c, b, b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      const patch = new THREE.Mesh(geometry, bellyMaterial);
      patch.castShadow = false;
      patch.receiveShadow = false;
      character.add(patch);
    }

    function taperedLimb(points, radii, material) {
      const curve = new THREE.CatmullRomCurve3(points.map((point) => new THREE.Vector3(...point)));
      const segments = 36;
      const radialSegments = 16;
      const frames = curve.computeFrenetFrames(segments, false);
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const scaled = t * (radii.length - 1);
        const index = Math.min(Math.floor(scaled), radii.length - 2);
        const radius = THREE.MathUtils.lerp(radii[index], radii[index + 1], scaled - index);
        const center = curve.getPointAt(t);
        for (let j = 0; j <= radialSegments; j++) {
          const angle = (j / radialSegments) * Math.PI * 2;
          const offset = frames.normals[i].clone().multiplyScalar(Math.cos(angle) * radius)
            .addScaledVector(frames.binormals[i], Math.sin(angle) * radius);
          positions.push(center.x + offset.x, center.y + offset.y, center.z + offset.z);
          uvs.push(j / radialSegments, t);
        }
      }

      for (let i = 0; i < segments; i++) {
        for (let j = 0; j < radialSegments; j++) {
          const a = i * (radialSegments + 1) + j;
          const b = a + radialSegments + 1;
          indices.push(a, a + 1, b, b, a + 1, b + 1);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      if (material === bodyLimbMaterial) {
        addProjectedVertexColors(geometry, positions, (vertex) => {
          const t = Math.floor(vertex / (radialSegments + 1)) / segments;
          return THREE.MathUtils.smoothstep(t, 0.78, 1) * 0.9;
        });
      }
      const limb = new THREE.Mesh(geometry, material);
      limb.castShadow = true;
      limb.receiveShadow = true;
      character.add(limb);
    }

    const bodyFrontZ = makeBody();
    makeBellyPatch(bodyFrontZ);

    for (const side of [-1, 1]) {
      // Start the arm within the torso so the matching surfaces overlap cleanly.
      taperedLimb([
        [side * 0.30, 2.78, 0.005],
        [side * 0.48, 2.70, 0.005],
        [side * 0.68, 2.40, 0.015],
        [side * 0.84, 1.78, 0.045],
        [side * 0.84, 1.40, 0.075],
      ], [0.22, 0.20, 0.165, 0.125, 0.095], bodyLimbMaterial);

      ellipsoid(character, handMaterial, [side * 0.84, 1.31, 0.095], [0.12, 0.145, 0.12], 28);
      for (let finger = 0; finger < 2; finger++) {
        const spread = (finger - 0.5) * 0.08;
        ellipsoid(character, handMaterial,
          [side * (0.84 + spread), 1.22, 0.12],
          [0.047, 0.085, 0.055], 20);
      }

      taperedLimb([
        [side * 0.37, 1.12, 0],
        [side * 0.40, 0.78, -0.005],
        [side * 0.46, 0.34, 0.015],
        [side * 0.49, 0.16, 0.04],
      ], [0.23, 0.18, 0.09, 0.045], bodyLimbMaterial);

      ellipsoid(character, footMaterial, [side * 0.51, 0.065, 0.16], [0.23, 0.035, 0.24], 32)
        .rotation.y = side * 0.12;
      for (let toe = 0; toe < 2; toe++) {
        const toeOffset = (toe - 0.5) * 0.24;
        ellipsoid(character, footMaterial,
          [side * 0.51 + toeOffset, 0.075, 0.405],
          [0.085, 0.047, 0.15], 24);
      }
    }

    for (const side of [-1, 1]) {
      const eye = new THREE.Group();
      eye.position.set(side * 0.205, 3.80, bodyFrontZ(side * 0.205, 3.80) - 0.025);
      eye.rotation.y = side * 0.10;
      character.add(eye);
      ellipsoid(eye, eyeRimMaterial, [0, 0, 0.006], [0.13, 0.145, 0.038], 32);
      ellipsoid(eye, irisMaterial, [0, 0, 0.029], [0.095, 0.112, 0.024], 32);
      ellipsoid(eye, pupilMaterial, [0, -0.004, 0.047], [0.06, 0.08, 0.016], 28);
      ellipsoid(eye, glintMaterial, [-0.025, 0.035, 0.06], [0.02, 0.022, 0.008], 16);
    }

    const mouthY = 3.51;
    const mouthPoints = [
      [-0.12, 3.53],
      [-0.06, 3.505],
      [0, 3.50],
      [0.06, 3.505],
      [0.12, 3.53],
    ];
    const smileCurve = new THREE.CatmullRomCurve3([
      ...mouthPoints.map(([x, y]) => new THREE.Vector3(x, y, bodyFrontZ(x, y) + 0.006)),
    ]);
    const smile = new THREE.Mesh(new THREE.TubeGeometry(smileCurve, 24, 0.009, 8, false), mouthMaterial);
    smile.castShadow = true;
    character.add(smile);

    const lowerLipCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.075, mouthY - 0.035, bodyFrontZ(-0.075, mouthY - 0.035) + 0.004),
      new THREE.Vector3(0, mouthY - 0.055, bodyFrontZ(0, mouthY - 0.055) + 0.008),
      new THREE.Vector3(0.075, mouthY - 0.035, bodyFrontZ(0.075, mouthY - 0.035) + 0.004),
    ]);
    const lowerLip = new THREE.Mesh(new THREE.TubeGeometry(lowerLipCurve, 16, 0.012, 8, false), bodyDetailMaterial);
    lowerLip.castShadow = true;
    character.add(lowerLip);

    function resize() {
      const width = stage.clientWidth;
      const height = stage.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    }

    const resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(stage);
    resize();

    const views = {
      front: new THREE.Vector3(0, 0.02, 1),
      side: new THREE.Vector3(1, 0.02, 0),
      back: new THREE.Vector3(0, 0.02, -1),
    };
    const viewButtons = [...document.querySelectorAll(".view-button")];

    function setView(name) {
      const compact = stage.clientWidth <= 650;
      const distance = compact ? 12 : 9.5;
      const targetX = 0;
      const targetY = compact ? 2.35 : 2.15;
      const direction = views[name];
      controls.target.set(targetX, targetY, 0);
      camera.position.set(
        targetX + direction.x * distance,
        targetY + direction.y * distance,
        direction.z * distance,
      );
      controls.update();
      viewButtons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.view === name));
      });
    }

    setView("front");
    viewButtons.forEach((button) => {
      button.addEventListener("click", () => setView(button.dataset.view));
    });

    const spinButton = document.querySelector("#spin-button");
    spinButton.addEventListener("click", () => {
      controls.autoRotate = !controls.autoRotate;
      spinButton.setAttribute("aria-pressed", String(controls.autoRotate));
    });

    document.querySelector("#reset-button").addEventListener("click", () => {
      controls.autoRotate = true;
      spinButton.setAttribute("aria-pressed", "true");
      setView("front");
      controls.update();
    });

    function downloadBlob(blob, filename) {
      const link = document.createElement("a");
      const objectUrl = URL.createObjectURL(blob);
      link.href = objectUrl;
      link.download = filename;
      link.click();
      window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
    }

    document.querySelector("#export-json-button").addEventListener("click", () => {
      try {
        const json = JSON.stringify(scene.toJSON());
        downloadBlob(new Blob([json], { type: "application/json" }), "nailong-scene.json");
      } catch (error) {
        console.error("Scene JSON export failed.", error);
        window.alert("场景 JSON 导出失败，请查看开发者控制台。");
      }
    });

    document.querySelector("#export-glb-button").addEventListener("click", () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        scene,
        (result) => downloadBlob(new Blob([result], { type: "model/gltf-binary" }), "nailong-scene.glb"),
        (error) => {
          console.error("GLB export failed.", error);
          window.alert("GLB 导出失败，请查看开发者控制台。");
        },
        { binary: true, onlyVisible: true },
      );
    });

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
